<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veille vive</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="marque">
      <span class="sceau">V2</span>
      <div>
        <strong>Veille vive</strong>
        <p>Une collecte. Sept filtres. Un mot, et ça part chercher.</p>
      </div>
    </div>
    <div class="progression" id="progression" hidden>
      <span id="prog-msg"></span>
      <div class="piste"><i id="prog-i"></i></div>
    </div>
    <div class="actions">
      <span id="compteurs" class="compteurs"></span>
      <button type="button" id="rafraichir">Rafraîchir les flux</button>
    </div>
  </header>
  <div class="corps">
    <aside class="rail">
      <p class="legende">Veilles</p>
      <nav id="veilles"></nav>
      <form id="nouvelle" class="nouvelle">
        <input name="titre" placeholder="Nouvelle veille" required minlength="2" autocomplete="off">
        <button type="submit">Créer</button>
      </form>
    </aside>
    <main>
      <div class="barre">
        <div>
          <h1 id="titre">…</h1>
          <p id="perimetre"></p>
        </div>
        <div class="fenetre" id="fenetre"></div>
      </div>
      <div class="exports">
        <span>Publier sur les Pages Perso</span>
        <button type="button" data-format="pdf">PDF</button>
        <button type="button" data-format="html">HTML</button>
        <button type="button" data-format="md">MD</button>
        <button type="button" id="exporter-tout" class="tout">Toutes les veilles</button>
        <p id="export-msg"></p>
      </div>
      <div class="rubriques" id="rubriques"></div>
      <div class="outils">
        <input id="filtre-texte" type="search" placeholder="Filtrer les titres déjà lus" autocomplete="off">
        <span id="volume"></span>
      </div>
      <div id="articles" class="articles"></div>
    </main>
    <aside class="atelier">
      <div class="onglets">
        <button type="button" data-onglet="mots" class="actif">Mots</button>
        <button type="button" data-onglet="radar">Radar</button>
        <button type="button" data-onglet="sources">Sources</button>
        <button type="button" data-onglet="courriel">Courriel</button>
        <button type="button" id="vue3d-ouvrir">3D</button>
      </div>
      <div id="panneau"></div>
    </aside>
  </div>
  <script src="/app.js"></script>
</body>
</html>
